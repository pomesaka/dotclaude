<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Review Monitor</title>
<link rel="icon" id="favicon">
<style>
  :root {
    --bg: #101014;
    --surface: #17171c;
    --surface-2: #1e1e25;
    --border: #2a2a33;
    --text: #e8e8ec;
    --text-dim: #9a9aa5;
    --text-faint: #62626e;
    --red: #f06a6a;
    --amber: #d9a13b;
    --green: #5fb878;
    --blue: #6ca0e8;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.01em; margin: 0; }
  h1 .sub { color: var(--text-faint); font-weight: 400; margin-left: 8px; font-size: 13px; }
  #updated { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  #updated.stale { color: var(--amber); }

  .repos { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 36px; }
  .repo-chip {
    font-family: var(--mono); font-size: 12px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 12px;
    background: var(--surface); text-decoration: none;
  }
  .repo-chip:hover { color: var(--text); border-color: var(--text-faint); }
  .repo-chip .agent { color: var(--text-faint); }

  section { margin-bottom: 36px; }
  .sec-title {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); margin: 0 0 12px 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .sec-title .count { font-family: var(--mono); color: var(--text-faint); font-weight: 400; }
  .sec-title.action { color: var(--red); }

  .empty { color: var(--text-faint); font-size: 13px; padding: 4px 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 10px;
  }
  .card.action { border-left: 3px solid var(--red); }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .pr-num { font-family: var(--mono); font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .pr-title { font-weight: 600; font-size: 14px; color: var(--text); text-decoration: none; }
  .pr-title:hover { text-decoration: underline; text-underline-offset: 3px; }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge {
    font-size: 11px; font-family: var(--mono); border-radius: 5px; padding: 2px 8px;
    border: 1px solid var(--border); color: var(--text-dim); background: var(--surface-2);
  }
  .badge.blocker { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .badge.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
  .badge a { color: var(--blue); text-decoration: none; }
  .badge a:hover { text-decoration: underline; }

  .meta { margin-top: 10px; font-size: 12px; color: var(--text-dim); display: flex; gap: 18px; flex-wrap: wrap; }
  .meta .k { color: var(--text-faint); }
  .meta .mono { font-family: var(--mono); }

  details { margin-top: 10px; }
  summary { font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none; }
  summary:hover { color: var(--text); }
  .findings { margin: 8px 0 0; padding: 0; list-style: none; }
  .findings li { padding: 5px 0; border-top: 1px solid var(--border); font-size: 12.5px; display: flex; gap: 10px; align-items: baseline; }
  .sev { font-family: var(--mono); font-size: 11px; flex-shrink: 0; width: 64px; }
  .sev-blocker { color: var(--red); }
  .sev-should { color: var(--amber); }
  .sev-nit, .sev-設計 { color: var(--text-faint); }
  .f-file { font-family: var(--mono); color: var(--blue); word-break: break-all; }
  .f-sum { color: var(--text-dim); }
  .dismissed-list li { color: var(--text-faint); text-decoration: line-through; }
  .notes { margin-top: 8px; font-size: 12px; color: var(--text-faint); }

  #error { display: none; margin: 24px 0; padding: 14px 18px; border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); border-radius: 10px; color: var(--red); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PR Review Monitor<span class="sub">レビュー依頼ステータス</span></h1>
    <div id="updated">読み込み中…</div>
  </header>
  <div class="repos" id="repos"></div>
  <div id="error"></div>
  <main id="main"></main>
</div>

<script>
const STATE_GROUPS = [
  { key: "action_required", title: "あなたのアクション待ち", cls: "action" },
  { key: "waiting", title: "待ち（あなたの作業なし）", cls: "" },
  { key: "unwatched", title: "監視対象外（依頼が来たら自動レビュー）", cls: "" },
];
const STATE_LABEL = {
  action_required: "コメント投稿待ち",
  waiting_author: "作者の対応待ち",
  waiting_request: "レビュー依頼待ち",
  unwatched: "依頼なし",
};

function groupKey(state) {
  if (state === "action_required") return "action_required";
  if (state === "unwatched") return "unwatched";
  return "waiting";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function rel(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  const abs = d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  if (mins < 1) return `${abs}（たった今）`;
  if (mins < 60) return `${abs}（${mins}分前）`;
  if (mins < 60 * 24) return `${abs}（${Math.round(mins / 60)}時間前）`;
  return abs;
}

// 開閉状態の保持: 30秒ごとの再描画で #main を innerHTML 丸ごと作り直すため、<details> の
// open がデフォルト（閉）に戻ってしまう。openKeys を唯一の真実とし、各 details の toggle で
// 即 localStorage に保存する（30秒更新でもリロードでも開閉が保たれる・閉じたら閉じたまま）。
// 初回訪問（localStorage 未設定）時のみ「指摘」をデフォルト展開し、その状態も保存する。以降は
// firstVisit=false で完全にユーザー操作を尊重する（リロードしても勝手に開かない）。
const OPEN_STORAGE_KEY = "prReviewMonitor.openDetails";
function loadOpenKeys() {
  try {
    const s = localStorage.getItem(OPEN_STORAGE_KEY);
    return { keys: new Set(s ? JSON.parse(s) : []), firstVisit: s === null };
  } catch { return { keys: new Set(), firstVisit: true }; }
}
function saveOpenKeys() {
  try { localStorage.setItem(OPEN_STORAGE_KEY, JSON.stringify([...openKeys])); } catch {}
}
let { keys: openKeys, firstVisit } = loadOpenKeys();

function findingsBlock(label, items, dismissed, keyBase) {
  if (!items || items.length === 0) return "";
  const key = `${keyBase}:${label}`;
  const isOpen = openKeys.has(key) || (firstVisit && label === "指摘");
  const lis = items.map(f => typeof f === "string"
    ? `<li><span class="f-sum">${esc(f)}</span></li>`
    : `<li><span class="sev sev-${esc(f.severity)}">[${esc(f.severity)}]</span><span><span class="f-file">${esc(f.file)}</span> <span class="f-sum">${esc(f.summary)}</span></span></li>`
  ).join("");
  return `<details data-key="${esc(key)}"${isOpen ? " open" : ""}><summary>${esc(label)}（${items.length}件）</summary><ul class="findings ${dismissed ? "dismissed-list" : ""}">${lis}</ul></details>`;
}

function card(pr) {
  const isAction = pr.state === "action_required";
  const blockerBadge = pr.lastReviewedAt
    ? (pr.blockers ? `<span class="badge blocker">マージブロッカーあり</span>` : `<span class="badge ok">ブロッカーなし</span>`)
    : "";
  const difitBadge = pr.difitUrl
    ? `<span class="badge">difit: <a href="${esc(pr.difitUrl)}" target="_blank">${esc(pr.difitUrl.replace("https://", ""))}</a>${pr.difitAlive === false ? "（停止中）" : ""}</span>`
    : "";
  return `<div class="card ${isAction ? "action" : ""}">
    <div class="card-head">
      <span class="pr-num">${esc(pr.repo)} #${esc(pr.number)}</span>
      <a class="pr-title" href="${esc(pr.url)}" target="_blank">${esc(pr.title)}</a>
    </div>
    <div class="badges">
      <span class="badge">${esc(STATE_LABEL[pr.state] ?? pr.state)}</span>
      ${blockerBadge}${difitBadge}
    </div>
    <div class="meta">
      <span><span class="k">最終レビュー </span>${rel(pr.lastReviewedAt)}</span>
      ${pr.reviewedSha ? `<span><span class="k">レビュー済み </span><span class="mono">${esc(pr.reviewedSha.slice(0, 7))}</span></span>` : ""}
      ${pr.headSha && pr.reviewedSha && pr.headSha !== pr.reviewedSha ? `<span><span class="k">head </span><span class="mono">${esc(pr.headSha.slice(0, 7))}</span>（未レビュー差分あり）</span>` : ""}
    </div>
    ${findingsBlock("指摘", pr.findings, false, `${pr.repo}#${pr.number}`)}
    ${findingsBlock("スルー判定（再指摘しない）", pr.dismissed, true, `${pr.repo}#${pr.number}`)}
    ${pr.notes?.length ? `<div class="notes">${pr.notes.map(esc).join(" · ")}</div>` : ""}
  </div>`;
}

// タブのインジケーター: タイトル + canvas で描く動的 favicon。
// PWA インストールなしのタブでは Badging API (setAppBadge) が使えないため、この2つが Chrome での正攻法。
function setTabIndicator(actionCount, stale) {
  const base = "PR Review Monitor";
  document.title = actionCount > 0 ? `🔴(${actionCount}) ${base}` : stale ? `⚠ ${base}` : base;

  // GitHub の status check 風: アイコン全体を1つのステータスシンボルにする（16px のタブで視認しやすい）。
  // 色は GitHub のパレット: success #2da44e / danger #cf222e / attention #bf8700
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const ctx = c.getContext("2d");
  ctx.beginPath();
  ctx.arc(32, 32, 28, 0, Math.PI * 2);
  ctx.fillStyle = actionCount > 0 ? "#cf222e" : stale ? "#bf8700" : "#2da44e";
  ctx.fill();
  if (actionCount > 0) {
    // 赤丸 + 件数（changes requested 相当）
    ctx.fillStyle = "#fff";
    ctx.font = "bold 34px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(actionCount > 9 ? "9+" : String(actionCount), 32, 35);
  } else if (stale) {
    // 黄丸 + 白ドット（pending 相当）
    ctx.beginPath();
    ctx.arc(32, 32, 10, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
  } else {
    // 緑丸 + 白チェック（success と同じ）
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(18, 33);
    ctx.lineTo(28, 43);
    ctx.lineTo(46, 23);
    ctx.stroke();
  }
  document.getElementById("favicon").href = c.toDataURL("image/png");
}

async function load() {
  const errEl = document.getElementById("error");
  try {
    const [stateRes, configRes] = await Promise.all([
      fetch("state.json", { cache: "no-store" }),
      fetch("config.json", { cache: "no-store" }),
    ]);
    if (!stateRes.ok) throw new Error(`state.json: HTTP ${stateRes.status}`);
    const state = await stateRes.json();
    const config = configRes.ok ? await configRes.json() : { repos: [] };
    errEl.style.display = "none";

    const upd = document.getElementById("updated");
    const updDate = new Date(state.updatedAt);
    const staleMin = Math.round((Date.now() - updDate.getTime()) / 60000);
    upd.textContent = `更新 ${rel(state.updatedAt)}`;
    const isStale = staleMin > 40;
    upd.classList.toggle("stale", isStale);
    if (isStale) upd.textContent += " ⚠ ループ停止の可能性";
    setTabIndicator((state.prs ?? []).filter(p => p.state === "action_required").length, isStale);

    document.getElementById("repos").innerHTML = (config.repos ?? []).map(r =>
      `<a class="repo-chip" href="https://github.com/${esc(r.repo)}/pulls" target="_blank">${esc(r.repo)}${r.reviewerAgent ? ` <span class="agent">· ${esc(r.reviewerAgent)}</span>` : ""}${r.authorFilter ? ` <span class="agent">· by ${esc(r.authorFilter)}</span>` : ""}</a>`
    ).join("");

    document.getElementById("main").innerHTML = STATE_GROUPS.map(g => {
      const prs = (state.prs ?? []).filter(p => groupKey(p.state) === g.key);
      const body = prs.length ? prs.map(card).join("") : `<div class="empty">なし</div>`;
      return `<section><h2 class="sec-title ${g.cls}">${esc(g.title)}<span class="count">${prs.length}</span></h2>${body}</section>`;
    }).join("");

    // 再描画で details は作り直されるので、開閉トグルを毎回張り直して即 localStorage に保存する。
    document.querySelectorAll("#main details").forEach(d => {
      d.addEventListener("toggle", () => {
        if (d.open) openKeys.add(d.dataset.key); else openKeys.delete(d.dataset.key);
        saveOpenKeys();
      });
    });
    // 初回訪問のデフォルト展開（指摘）を openKeys に取り込んで永続化。以降は firstVisit=false で
    // 純粋にユーザーの開閉を尊重する（リロードで勝手に開かない）。
    if (firstVisit) {
      document.querySelectorAll("#main details[open]").forEach(d => openKeys.add(d.dataset.key));
      firstVisit = false;
      saveOpenKeys();
    }
  } catch (e) {
    errEl.style.display = "block";
    errEl.textContent = `読み込みエラー: ${e.message}`;
  }
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
